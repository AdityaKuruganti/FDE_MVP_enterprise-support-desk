name: Trigger auto deployment for mvpcontainersample

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/mvpcontainersample-AutoDeployTrigger-79054e32-2a0e-45fc-acd2-06cb9a748ba2.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MVPCONTAINERSAMPLE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MVPCONTAINERSAMPLE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MVPCONTAINERSAMPLE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/session3-api/DockerFile
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: mvpcontainersample.azurecr.io
          registryUsername: ${{ secrets.MVPCONTAINERSAMPLE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MVPCONTAINERSAMPLE_REGISTRY_PASSWORD }}
          containerAppName: mvpcontainersample
          resourceGroup: SampleMVP
          imageToBuild: mvpcontainersample.azurecr.io/mvpcontainersample:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


